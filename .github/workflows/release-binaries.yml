name: release-binaries

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the binaries as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - main
      - master
      - nx2-experimental
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - "tools/**"
      - ".patch/**"
      - "cpmfile.json"
      - "*.profdata"
      - "*.profraw.gz"
      - ".github/workflows/release-binaries.yml"

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare release tag
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3 4; do "$@" && return 0; echo "::warning::attempt $n of '$*' failed; retrying" >&2; sleep $((n * 30)); done; return 1; }
          tag="v6.2"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" >/dev/null 2>&1; then
            retry gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/$tag" \
              -f "sha=$GITHUB_SHA" -F "force=true"
          else
            retry gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi

  build:
    name: ${{ matrix.platform }} binary
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64-pgo
            runner: windows-2022
            pgo: true
            profile: fritcheelii-windows.profdata
            profraw_gz: fritcheelii-windows.profraw.gz
          - platform: linux-x86_64
            runner: ubuntu-24.04
            pgo: false
            profile: ""
            profraw_gz: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Check PGO profile
        if: matrix.pgo
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.profraw_gz }}" ]; then
            test -s "${{ matrix.profraw_gz }}"
          else
            test -s "${{ matrix.profile }}"
          fi

      # ── Windows setup ──────────────────────────────────────────────────────
      - name: Set up MSVC
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Merge custom Windows PGO profile
        if: startsWith(matrix.platform, 'windows') && matrix.pgo && matrix.profraw_gz != ''
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc "${{ matrix.profraw_gz }}" > fritcheelii-windows.profraw
          "$LLVM_ROOT/bin/llvm-profdata.exe" merge -output="${{ matrix.profile }}" fritcheelii-windows.profraw
          rm -f fritcheelii-windows.profraw
          ls -lh "${{ matrix.profile }}"

      - name: Install Qt on Windows
        if: startsWith(matrix.platform, 'windows')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          $url = 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip'
          $ok = $false
          foreach ($attempt in 1..5) {
            try {
              Invoke-WebRequest -OutFile $zip $url -TimeoutSec 120
              $ok = $true
              break
            } catch {
              Write-Host "sccache download attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          if (-not $ok) {
            Write-Host "::warning::sccache could not be downloaded; building without the compiler cache"
            exit 0
          }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: glslangValidator --version

      # ── Linux setup ────────────────────────────────────────────────────────
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf cmake g++ gcc git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache python3-zstandard \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt on Linux x86_64
        if: startsWith(matrix.platform, 'linux')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts qtimageformats
          cache: true

      # ── Caches ─────────────────────────────────────────────────────────────
      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects (Windows)
        if: startsWith(matrix.platform, 'windows')
        id: compiler-cache-win
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-${{ matrix.platform }}-${{ hashFiles(matrix.profraw_gz) }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}-${{ hashFiles(matrix.profraw_gz) }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}-${{ hashFiles(matrix.profraw_gz) }}-v2-

      - name: Restore compiler objects (Linux)
        if: startsWith(matrix.platform, 'linux')
        id: compiler-cache-linux
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: objects-${{ matrix.platform }}-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}-v2-${{ github.sha }}-
            objects-${{ matrix.platform }}-v2-

      # ── Configure ──────────────────────────────────────────────────────────
      - name: Configure Windows PGO
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
          flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
          flags+=" -Wno-error=backend-plugin"
          launcher=()
          if command -v sccache > /dev/null; then
            launcher=(-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          fi
          retry() { local n; for n in 1 2 3 4; do "$@" && return 0; echo "::warning::attempt $n of '$*' failed; retrying" >&2; sleep $((n * 30)); done; return 1; }
          retry cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_SIRIT=OFF \
            -DENABLE_WERROR=OFF \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            "${launcher[@]}" \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            "-DCMAKE_EXE_LINKER_FLAGS=/machine:x64" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Configure Linux
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3 4; do "$@" && return 0; echo "::warning::attempt $n of '$*' failed; retrying" >&2; sleep $((n * 30)); done; return 1; }
          retry cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_WERROR=OFF \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache > /dev/null; then sccache --zero-stats; fi
          if command -v ccache > /dev/null; then ccache -z; fi
          cmake --build build/release --target yuzu --parallel
          if command -v sccache > /dev/null; then sccache --show-stats; fi
          if command -v ccache > /dev/null; then ccache -s; fi

      - name: Stop sccache on Windows
        if: startsWith(matrix.platform, 'windows') && always() && steps.compiler-cache-win.outcome == 'success'
        shell: pwsh
        run: if (Get-Command sccache -ErrorAction SilentlyContinue) { sccache --stop-server 2>$null; $global:LASTEXITCODE = 0 }

      - name: Save compiler objects (Windows)
        if: startsWith(matrix.platform, 'windows') && always() && steps.compiler-cache-win.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache-win.outputs.cache-primary-key }}

      - name: Save compiler objects (Linux)
        if: startsWith(matrix.platform, 'linux') && always() && steps.compiler-cache-linux.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ steps.compiler-cache-linux.outputs.cache-primary-key }}

      # ── Package & Upload ───────────────────────────────────────────────────
      - name: Package Windows binary
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          if (Test-Path "build/release/bin/cheezyemu.exe") {
            Move-Item -Force "build/release/bin/cheezyemu.exe" "build/release/bin/FritCheeLii v6.2.exe"
          }
          if (-not (Test-Path "build/release/bin/FritCheeLii v6.2.exe")) {
            throw "build/release/bin/FritCheeLii v6.2.exe was not produced"
          }
          windeployqt --release --no-translations "build/release/bin/FritCheeLii v6.2.exe"

      - name: Upload Windows binary
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: FritCheeLii-${{ matrix.platform }}-${{ github.sha }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 1

      - name: Package Linux AppImage and tar.gz
        if: startsWith(matrix.platform, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          test -x build/release/bin/cheezyemu
          mv build/release/bin/cheezyemu build/release/bin/FritCheeLii
          strip build/release/bin/FritCheeLii

          tools="$RUNNER_TEMP/linuxdeploy"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools"/*.AppImage

          icon="$RUNNER_TEMP/fritcheelii.png"
          cp dist/cheezyemu.png "$icon"
          desktop="$RUNNER_TEMP/FritCheeLii.desktop"
          cat > "$desktop" <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=FritCheeLii
          Exec=FritCheeLii
          Icon=fritcheelii
          Categories=Game;Emulator;
          Terminal=false
          DESK

          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export EXTRA_QT_MODULES=waylandcompositor
          export EXTRA_PLATFORM_PLUGINS='libqwayland-egl.so;libqwayland-generic.so'
          export LDAI_VERSION="v6.2-${GITHUB_SHA::7}"
          export LDAI_OUTPUT="FritCheeLii-v6.2-Linux-x86_64.AppImage"
          export OUTPUT="$LDAI_OUTPUT"
          export ARCH="x86_64"

          mkdir -p AppDir/usr/bin linux-dist
          if [ -f build/release/bin/nx2_switches.txt ]; then
            cp build/release/bin/nx2_switches.txt AppDir/usr/bin/
          fi

          "$tools/linuxdeploy-x86_64.AppImage" --appdir AppDir \
            --executable build/release/bin/FritCheeLii \
            --exclude-library 'libvulkan.so*' \
            --desktop-file "$desktop" \
            --icon-file "$icon" \
            --plugin qt \
            --output appimage

          test -s "$LDAI_OUTPUT"
          mv "$LDAI_OUTPUT" linux-dist/
          mv AppDir "FritCheeLii-v6.2"
          ln -s usr/bin/FritCheeLii "FritCheeLii-v6.2/FritCheeLii"
          tar -czf "linux-dist/FritCheeLii-v6.2-Linux-x86_64.tar.gz" "FritCheeLii-v6.2"
          ls -la linux-dist

      - name: Upload Linux binary
        if: startsWith(matrix.platform, 'linux')
        uses: actions/upload-artifact@v7
        with:
          name: FritCheeLii-${{ matrix.platform }}-${{ github.sha }}
          path: linux-dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v7
        with:
          name: FritCheeLii-windows-x86_64-pgo-${{ github.sha }}
          path: "stage/FritCheeLii v6.2"

      - name: Download Linux binaries
        uses: actions/download-artifact@v7
        with:
          name: FritCheeLii-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -f "stage/FritCheeLii v6.2/FritCheeLii v6.2.exe"
          (cd stage && zip -qr "${GITHUB_WORKSPACE}/dist/FritCheeLii-v6.2-Windows-x64.zip" "FritCheeLii v6.2")
          test -f "dist/FritCheeLii-v6.2-Linux-x86_64.AppImage"
          test -f "dist/FritCheeLii-v6.2-Linux-x86_64.tar.gz"
          ls -la dist

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3 4; do "$@" && return 0; echo "::warning::attempt $n of '$*' failed; retrying" >&2; sleep $((n * 30)); done; return 1; }
          tag="v6.2"
          tag_sha=$(retry gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag ${tag} points to $tag_sha instead of $GITHUB_SHA"
            exit 1
          fi
          cat > notes.md <<EOF
          > **Updating from an older version?** Keep or copy your existing \`user\` folder into the new FritCheeLii folder to preserve your saves, settings, and compiled shader cache (no need to rebuild shaders!).

          ## What's New in v6.2
          - **Custom FritCheeLii Windows PGO Profile (\`fritcheelii-windows.profdata\`):** Recorded directly on real *Ocarina of Time* gameplay across Hyrule Castle/Market, Hyrule Field/Lon Lon, Kokiri Forest, Kakariko Village, and Dodongo's Cavern with all 13 \`Extra+\` optimizations active
          - **First-Launch Language Selector:** Prompts on first launch (pre-selected from your OS locale) to configure both emulator menus and the in-game *Ocarina of Time* language in one step
          - **Multi-Save ALL Slots Backup & Restore (Slots 1–8):** Import and export all 8 Multi-Save slots (plus names & active slot) at once via portable folder or \`.zip\` backup
          - **Graphics Tab Polish & Fixes:** Fixed \`NVIDIA DLSS Frame Gen\` visibility in the Windows dropdown, fixed clipped status text in the \`NVIDIA DLSS\` panel, aligned \`Upscaling Method\` 50/50, moved \`Frame Generation (Built-in)\` directly under \`Upscaling & 3D Render Scale\`, added explanatory tooltips, and reordered upscaling presets cleanly
          - **Dynamic Shader Cache Manager & Clear Cache UX:** Reads exact compiled shader counts dynamically (\`12,760\` graphics + \`1,520\` compute = \`14,280\` total), clarifies resume-on-close on the shader building screen, and unifies \`Clear Shader Cache\` auto-restart into a single confirmation dialog
          - **Edge-Flush Overlay (\`Margin = 0\`) & Auto-Warmup Benchmark:** Overlay sits flush against the screen corner and supports \`WARMUP 30s → BENCH 30s\` automated countdowns; removed \`Test\` tab after A/B validation

          ## Highlights from v6.1
          - **Unified \`Upscaling Method\` + \`3D Render Scale\` UI, Lichii \`build-410\` Optical Flow 5-Level Frame Gen & NVIDIA DLSS-G:** Built-in Frame Gen without external apps, \`EXP115\` promoted to \`Extra+\` (13 switches ON), expanded real-gameplay cache (\`12,760\` gfx + \`1,520\` compute), slimmer \`PerformanceOverlay\` with live PDH Turbo Clock, fixed Ocarina \`Y\` guide sprite, and Windows 11 \`F11\` fullscreen fix

          ## Highlights from v6.0
          - **Promoted Proven A/B Winners to \`Extra+\` (ON by default):** \`Fast ASTC GPU Decoder\`, \`Exact Byte Readback — Culling Anti-Stall\`, \`Shader Precache Crash-Skip Journal\`, \`Shadow Size Steps\`, \`JIT Block Warm-Up\`, \`Host Zstd\`, \`Texture Tidy-Up 1s\`, \`4 GB VRAM Smart Texture GC\`, \`4K Texture Mip Cap\`, and Hybrid RTSS-style Pacer

          ## Credits
          Built on GPL open-source code with advancements from **Fritchii v6.5 (Frizti & Bakemono)**, **CheezyEmu**, **Lichii (build-410)**, **Longshot (MagicBeanDev)**, **NX2Saria (Larbaco)**, **Triforce**, **Eglantine**, **Eden / Yuzu**, and **Dark (Dynamic FPS)**.
          EOF

          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true
          gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "FritCheeLii v6.2" \
            --notes-file notes.md

      - name: Delete temporary Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for art_name in \
            "FritCheeLii-windows-x86_64-pgo-${GITHUB_SHA}" \
            "FritCheeLii-linux-x86_64-${GITHUB_SHA}"; do
            art_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${art_name}\") | .id" | head -n 1 || true)
            if [ -n "${art_id}" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art_id}" || true
            fi
          done
